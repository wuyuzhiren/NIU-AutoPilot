plugins {
    id 'com.android.application'
}

android {
    namespace 'com.niu.autopilot'
    compileSdk 34

    defaultConfig {
        applicationId "com.niu.autopilot"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "2.8"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
